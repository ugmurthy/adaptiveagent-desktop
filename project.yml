name: AdaptiveAgentDesktop
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "14.0"
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.adaptiveagent.desktop
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  AdaptiveAgentDesktop:
    type: application
    platform: macOS
    sources:
      - Sources/AdaptiveAgentDesktop
      - path: Resources/AgentRuntime
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: AdaptiveAgentDesktop
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AdaptiveAgent Desktop
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - package: MarkdownUI
    scheme:
      testTargets:
        - AdaptiveAgentDesktopTests
  AdaptiveAgentDesktopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AdaptiveAgentDesktopTests
    dependencies:
      - target: AdaptiveAgentDesktop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

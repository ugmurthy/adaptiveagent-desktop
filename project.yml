name: AdaptiveAgentDesktop
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "14.0"
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.adaptiveagent.desktop
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  AdaptiveAgentDesktop:
    type: application
    platform: macOS
    sources:
      - Sources/AdaptiveAgentDesktop
      - path: Resources/AgentRuntime
        type: folder
        buildPhase: resources
      - path: Resources/TraceSession
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: AdaptiveAgentDesktop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AdaptiveAgent Desktop
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSMicrophoneUsageDescription: AdaptiveAgent Desktop uses your microphone while you dictate run and chat text.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: AdaptiveAgent Desktop uses speech recognition to turn your dictation into run and chat text.
        CODE_SIGN_IDENTITY: "-"
    entitlements:
      path: AdaptiveAgentDesktop.entitlements
      properties:
        com.apple.security.device.audio-input: true
    dependencies:
      - package: MarkdownUI
    scheme:
      testTargets:
        - AdaptiveAgentDesktopTests
  AdaptiveAgentDesktopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AdaptiveAgentDesktopTests
    dependencies:
      - target: AdaptiveAgentDesktop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
